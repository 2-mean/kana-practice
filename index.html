<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="히라가나·가타카나 읽기와 펜 쓰기 연습 — 획순, 닮은 글자까지 확인하는 연습장">
<title>가나 연습장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Gowun+Dodum&family=Klee+One:wght@400;600&family=Noto+Sans+JP:wght@400;500&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/gridpad.css">
<link rel="stylesheet" href="css/words.css">
</head>
<body>
<a class="skip-link" id="skip-link" href="#main">본문으로 건너뛰기</a>
<header class="topbar">
  <div class="topbar-in wrap">
    <a class="brand" id="brand" href="#" aria-label="가나 연습장 — 처음 화면">
      <span class="brand-mark" lang="ja" aria-hidden="true">か</span>
      <span class="brand-name">가나 연습장</span>
    </a>
    <nav class="tabs" aria-label="주 메뉴">
      <button type="button" class="tab" data-nav="home">연습</button>
      <button type="button" class="tab" data-nav="chart">글자표</button>
      <button type="button" class="tab" data-nav="records">기록</button>
    </nav>
    <button type="button" class="icon-btn theme-btn" id="theme-btn" aria-label="화면 테마"></button>
  </div>
</header>

<main id="main" class="wrap main" tabindex="-1">
  <noscript><p>이 연습장은 자바스크립트가 필요해요.</p></noscript>
</main>

<footer class="foot wrap">
  <p id="storage-note" class="note-warn" hidden>이 브라우저에서는 기록을 저장할 수 없어요. 새로 고치거나 창을 닫으면 기록이 사라져요.</p>

</footer>

<dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>
<dialog id="cheat" class="sheet sheet-wide" aria-labelledby="cheat-title"></dialog>
<dialog id="confirm" class="confirm" aria-labelledby="confirm-title"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- dependency order: data → text/judges → logic → persistence → views → app → modules (js/kanji-data.js is
     not a tag: KanjiJudge.load() injects it when a 단어장 practice first needs kanji strokes) -->
<script src="js/svgpath.js"></script>
<script src="js/kana-data.js"></script>
<script src="js/romaji.js"></script>
<script src="js/recognizer.js"></script>
<script src="js/kanji-judge.js"></script>
<script src="js/align.js"></script>
<script src="js/quiz.js"></script>
<script src="js/store.js"></script>
<script src="js/strokeview.js"></script>
<script src="js/drawpad.js"></script>
<script src="js/gridpad.js"></script>
<script src="js/app.js"></script>
<script src="js/word-presets.js"></script>
<script src="js/wordio.js"></script>
<script src="js/words.js"></script>

</html>
